  - name: products
    label: 产品
    label_singular: 产品
    folder: src/content/products
    create: true
    extension: md
    format: frontmatter
    slug: '{{slug}}'
    summary: '{{title}}'
    fields:
      - label: 产品名称
        name: title
        widget: string
      - label: 分类
        name: category
        widget: select
        options:
          - label: 不锈钢餐具套装
            value: flatware-sets
          - label: 不锈钢厨具套装
            value: kitchenware-sets
      - label: 简介（列表/分享展示）
        name: summary
        widget: text
      - label: 产品图片（第一张为主图）
        name: images
        widget: list
        field:
          label: 图片
          name: image
          widget: image
      - label: 材质
        name: material
        widget: string
        required: false
      - label: 表面工艺
        name: finish
        widget: string
        required: false
      - label: 起订量 MOQ
        name: moq
        widget: string
        required: false
      - label: 交期
        name: leadTime
        widget: string
        required: false
      - label: 额外规格行（可选）
        name: specs
        widget: list
        required: false
        fields:
          - label: 名称
            name: label
            widget: string
          - label: 数值
            name: value
            widget: string
      - label: 精选标记（目录元数据）
        name: featured
        widget: boolean
        default: false
        required: false
        hint: 首页8款的实际顺序在共享入口的「首页新增板块与精选顺序」维护。
      - label: 排序（数字越小越靠前）
        name: order
        widget: number
        default: 99
        value_type: int
        required: false
      - label: 详细介绍
        name: body
        widget: markdown
      - label: Draft
        name: draft
        widget: boolean
        required: true
        default: false
      - label: Status
        name: status
        widget: select
        required: true
        options:
          - draft
          - approved
          - published
        default: published
      - label: Publish At
        name: publishAt
        widget: datetime
        required: false
        hint: 只有状态为 published、Draft 关闭且已到发布时间的内容才会生成。定时到点仍需一次网站构建，不会仅靠保存自动定时上线。
      - label: 中英文翻译关联标识
        name: translationKey
        widget: string
        required: false
        hint: 通常与当前中文文件标识一致，英文翻译选择本条目后使用相同标识。旧内容未填写时仍沿用原文件ID；发布后请勿任意修改。
        pattern:
          - ^[a-z0-9]+(?:-[a-z0-9]+)*$
          - 只使用小写英文字母、数字与短横线。
      - label: Date Modified
        name: dateModified
        widget: datetime
        required: false
      - name: locale
        label: 语言
        widget: hidden
        default: zh-CN
        required: false
      - label: 页面地址标识（已有内容可留空）
        name: slug
        widget: string
        required: false
        pattern:
          - ^[a-z0-9]+(?:-[a-z0-9]+)*$
          - 只使用小写英文字母、数字与短横线。
        hint: 留空继续使用现有文件ID，不会迁移旧地址。为新条目填写后，中文与英文尽量使用同一稳定英文标识；上线后修改需另行安排旧地址跳转。
      - label: 搜索结果标题（可选）
        name: seoTitle
        widget: string
        required: false
      - label: 搜索结果描述（可选）
        name: metaDescription
        widget: text
        required: false
      - label: 页面H1标题（可选）
        name: h1
        widget: string
        required: false
    preview_path: /cn/products/{{slug}}/
    description: 中文和英文通过同一翻译关联标识配对。配对不自动翻译；发布前核对型号、数量、材质、MOQ与来源。已发布地址和关联标识不要随意改动。
