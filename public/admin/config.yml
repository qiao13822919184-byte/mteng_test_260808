            max: 2
            summary: '{{fields.zh.title}} / {{fields.en.title}}'
            hint: 两大类目共享同一结构；图片在中英文产品分类中维护，文字在这里同时核对。
          - label: 首页精选产品顺序（8款）
            name: featuredProductKeys
            widget: list
            collapsed: true
            field:
              label: 选择产品
              name: product
              widget: relation
              collection: productsEn
              search_fields:
                - title
                - model
                - translationKey
              display_fields:
                - '{{title}} — {{translationKey}}'
              value_field: translationKey
              filters:
                - field: status
                  values:
                    - published
                - field: draft
                  values:
                    - false
            min: 8
            max: 8
            hint: 顺序同时用于中英文首页。请选择已发布且有中文对应版本的产品，保留4款厨具与4款餐具；每种语言的参数仍需人工核对。
