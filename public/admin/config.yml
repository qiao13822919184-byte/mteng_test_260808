                  - label: 标题
                    name: title
                    widget: string
                  - label: 简介
                    name: lead
                    widget: text
                    hint: 保留现有大括号内容即可，网页会自动填入「共享企业资料」中的事实；改年份或企业名称请到共享资料入口，不需要编写代码。
                  - label: 正文
                    name: body
                    widget: text
                    hint: 保留现有大括号内容即可，网页会自动填入「共享企业资料」中的事实；改年份或企业名称请到共享资料入口，不需要编写代码。
                  - label: 联系按钮文字
                    name: contactLabel
                    widget: string
                  - label: 关于按钮文字
                    name: aboutLabel
                    widget: string
                  - label: 图片说明
                    name: imageAlt
