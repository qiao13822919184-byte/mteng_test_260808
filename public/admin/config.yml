backend:
  name: github
  repo: qiao13822919184-byte/mteng_test_260808
  branch: main
media_folder: public/uploads
public_folder: /uploads
local_backend: true
locale: zh_Hans
collections:
  - name: sharedContent
    label: 中英共享资料与新版页面
    description: 企业事实统一维护；中英文文案分别核对，不自动翻译。修改后需通过构建检查才会更新线上页面。
    delete: false
    editor:
      preview: false
    preview_path: /
    files:
      - name: identity
        label: 共享企业资料（中英唯一事实来源）
        file: src/data/identity.json
        preview_path: /
        fields:
          - label: 统一英文品牌
            name: brandEn
            widget: string
          - label: 统一中文品牌
            name: brandZh
            widget: string
          - label: 营业执照中文登记名称
            name: legalNameZh
            widget: string
            hint: 以当前营业执照登记名称为准，中英文页面共用。
          - label: 统一英文企业名称
            name: companyNameEn
            widget: string
            hint: 统一对外英文名称；不将英文译名标注为政府登记英文名。
          - label: 统一社会信用代码
            name: creditCode
            widget: string
            pattern:
              - ^[0-9A-Z]{18}$
              - 请填写营业执照上的18位统一社会信用代码。
          - label: 品牌／工厂业务起始年
            name: businessStartYear
            widget: number
            value_type: int
            min: 1900
            max: 2100
            hint: 当前2003仅为品牌／工厂开始经营的年份，不是有限公司营业执照的登记成立日期。
          - label: 统一品牌标志
            name: logo
            widget: image
          - label: 中英文共享联系方式
            name: contact
            widget: object
            collapsed: true
            fields:
              - label: WhatsApp 号码（国家码及纯数字）
                name: whatsappDigits
                widget: string
                pattern:
                  - ^[0-9]{8,15}$
                  - 只填国家码和号码，不含加号、空格。
              - label: WhatsApp 显示号码
                name: whatsappDisplay
                widget: string
              - label: 电话号码
                name: phoneDisplay
                widget: string
              - label: 邮箱
                name: email
                widget: string
                pattern:
                  - ^[^\s@]+@[^\s@]+\.[^\s@]+$
                  - 请填写有效邮箱。
              - label: 微信
                name: wechat
                widget: string
                required: false
          - label: 地址
            name: address
            widget: object
            collapsed: true
            fields:
              - label: 中文
                name: zh
                widget: string
              - label: 英文
                name: en
                widget: string
            hint: 在同一入口同时维护中文和英文表述；两个语言页面共享这些事实。
          - label: 营业时间
            name: businessHours
            widget: object
            collapsed: true
            fields:
              - label: 中文
                name: zh
                widget: string
              - label: 英文
                name: en
                widget: string
            hint: 在同一入口同时维护中文和英文表述；两个语言页面共享这些事实。
